stages:
  - build
  - test
  - security
  - docker_build
  - deploy

variables:
  APP_DIR: "application/demo-app"
  DOCKERHUB_IMAGE: "richardakbar/gitlab-devsecops-demo-app"

build:
  stage: build
  tags:
    - devsecops
  script:
    - cd "$APP_DIR"
    - chmod +x mvnw
    - ./mvnw -B -DskipTests package
  artifacts:
    paths:
      - application/demo-app/target/*.jar
    expire_in: 1 day

test:
  stage: test
  tags:
    - devsecops
  script:
    - cd "$APP_DIR"
    - ./mvnw -B test

security_scan:
  stage: security
  tags:
    - devsecops
  script:
    - trivy fs --scanners vuln,misconfig,secret --exit-code 0 --format table .

docker_build:
  stage: docker_build
  tags:
    - devsecops
  script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - export DOCKER_CONFIG="$(mktemp -d)"
    - trap 'rm -rf "$DOCKER_CONFIG"' EXIT
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$DOCKERHUB_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$DOCKERHUB_IMAGE:latest" -f "$APP_DIR/Dockerfile" "$APP_DIR"
    - docker push "$DOCKERHUB_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKERHUB_IMAGE:latest"

deploy:
  stage: deploy
  tags:
    - devsecops
  when: manual
  script:
    - |
      set -Eeuo pipefail

      IMAGE="$DOCKERHUB_IMAGE:$CI_COMMIT_SHORT_SHA"
      CONTAINER="gitlab-demo-app"
      PREVIOUS_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)"

      echo "=== Pulling New Image ==="
      docker pull "$IMAGE"

      echo "=== Stopping Previous Container ==="
      docker rm -f "$CONTAINER" || true

      echo "=== Starting New Container ==="
      docker run -d --name "$CONTAINER" -p 8083:8081 --restart unless-stopped "$IMAGE"

      echo "=== Application Health Check ==="
      HEALTHY=false

      for attempt in $(seq 1 30); do
        if curl --fail --silent http://localhost:8083/health; then
          echo
          HEALTHY=true
          break
        fi
        echo "Waiting for application... ($attempt/30)"
        sleep 2
      done

      if [ "$HEALTHY" = true ]; then
        echo "Deployment successful. Application is healthy."
      else
        echo "Deployment failed. Starting rollback..."
        docker rm -f "$CONTAINER" || true

        if [ -n "$PREVIOUS_IMAGE" ]; then
          docker run -d --name "$CONTAINER" -p 8083:8081 --restart unless-stopped "$PREVIOUS_IMAGE"
          echo "Rollback started using previous image: $PREVIOUS_IMAGE"
        else
          echo "No previous image available for rollback."
        fi

        exit 1
      fi
