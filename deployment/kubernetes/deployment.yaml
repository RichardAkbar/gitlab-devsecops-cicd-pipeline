apiVersion: apps/v1
kind: Deployment
metadata:
  name: richard-devsecops-app
  namespace: devsecops
  labels:
    app: richard-devsecops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: richard-devsecops-app
  template:
    metadata:
      labels:
        app: richard-devsecops-app
    spec:
      containers:
        - name: demo-app
          image: REPLACE_WITH_REGISTRY_IMAGE
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
